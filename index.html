<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parando de Fumar</title>
</head>
<body>
    <div class="container">
        <h1>🚭 Dias Sem Fumar</h1>
        
        <div class="contador">
            <span id="dias">0</span>
            <p>dias</p>
        </div>
        
        <div class="timer">
            <p id="tempo">00:00:00</p>
        </div>
        
        <button id="btnTimer">Iniciar Timer</button>
        <button id="btnReset" class="danger">Recaí</button>
        <p class="motivacao">A constância imperfeita é melhor do que a perfeição inexistente</p>
        
        <script src="script.js"></script>
    </div>
</body>
</html>
